<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil | School Management</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/table.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="logo">

                <i class="fa-solid fa-graduation-cap"></i>

                <h2>School Management</h2>

            </div>

            <nav>

                <ul>

                    <li>
                        <a href="dashboard.html">
                            <i class="fa-solid fa-house"></i>
                            Tableau de bord
                        </a>
                    </li>

                    <li>
                        <a href="users.html">
                            <i class="fa-solid fa-users"></i>
                            Utilisateurs
                        </a>
                    </li>

                    <li>
                        <a href="students.html">
                            <i class="fa-solid fa-user-graduate"></i>
                            Étudiants
                        </a>
                    </li>

                    <li>
                        <a href="teachers.html">
                            <i class="fa-solid fa-chalkboard-user"></i>
                            Enseignants
                        </a>
                    </li>

                    <li>
                        <a href="subjects.html">
                            <i class="fa-solid fa-book"></i>
                            Matières
                        </a>
                    </li>

                    <li>
                        <a href="grades.html">
                            <i class="fa-solid fa-square-poll-horizontal"></i>
                            Notes
                        </a>
                    </li>

                    <li>
                        <a href="absences.html">
                            <i class="fa-solid fa-calendar-xmark"></i>
                            Absences
                        </a>
                    </li>

                    <li>
                        <a href="statistics.html">
                            <i class="fa-solid fa-chart-line"></i>
                            Statistiques
                        </a>
                    </li>

                    <li class="active">
                        <a href="profile.html">
                            <i class="fa-solid fa-user"></i>
                            Profil
                        </a>
                    </li>

                    <li>
                        <a href="index.html">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            Déconnexion
                        </a>
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- ================= CONTENU ================= -->

        <main class="content">

            <header class="header">

                <h1>Mon Profil</h1>

            </header>

            <section class="profile-card">

                <div class="profile-image">

                    <i class="fa-solid fa-circle-user"></i>

                </div>

                <div class="profile-info">

                    <h2 id="userName">Nom de l'utilisateur</h2>

                    <p>
                        <strong>Rôle :</strong>
                        <span id="userRole">Admin</span>
                    </p>

                    <p>
                        <strong>Email :</strong>
                        <span id="userEmail">email@example.com</span>
                    </p>

                    <p>
                        <strong>ID :</strong>
                        <span id="userId">1</span>
                    </p>

                </div>

            </section>

            <section class="profile-actions">

                <button id="btnEditProfile">

                    <i class="fa-solid fa-pen"></i>

                    Modifier le profil

                </button>

                <button id="btnChangePassword">

                    <i class="fa-solid fa-key"></i>

                    Modifier le mot de passe

                </button>

                <button id="btnLogout">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Déconnexion

                </button>

            </section>

        </main>

    </div>

    <!-- ================= MODAL ================= -->

    <div class="modal" id="profileModal">

        <div class="modal-content">

            <h2>Modifier le profil</h2>

            <form id="profileForm">

                <label>Nom</label>

                <input type="text" id="name" required>

                <label>Email</label>

                <input type="email" id="email" required>

                <div class="buttons">

                    <button type="submit">

                        Enregistrer

                    </button>

                    <button type="button" id="closeProfileModal">

                        Annuler

                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="js/profile.js"></script>

</body>

</html>
