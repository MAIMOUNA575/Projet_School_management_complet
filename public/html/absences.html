<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Absences | School Management</title>

    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/table.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="logo">

                <i class="fa-solid fa-graduation-cap"></i>

                <h2>School Management</h2>

            </div>

            <nav>

                <ul>

                    <li>
                        <a href="dashboard.html">
                            <i class="fa-solid fa-house"></i>
                            Tableau de bord
                        </a>
                    </li>

                    <li>
                        <a href="users.html">
                            <i class="fa-solid fa-users"></i>
                            Utilisateurs
                        </a>
                    </li>

                    <li>
                        <a href="students.html">
                            <i class="fa-solid fa-user-graduate"></i>
                            Étudiants
                        </a>
                    </li>

                    <li>
                        <a href="teachers.html">
                            <i class="fa-solid fa-chalkboard-user"></i>
                            Enseignants
                        </a>
                    </li>

                    <li>
                        <a href="subjects.html">
                            <i class="fa-solid fa-book"></i>
                            Matières
                        </a>
                    </li>

                    <li>
                        <a href="grades.html">
                            <i class="fa-solid fa-square-poll-horizontal"></i>
                            Notes
                        </a>
                    </li>

                    <li class="active">
                        <a href="absences.html">
                            <i class="fa-solid fa-calendar-xmark"></i>
                            Absences
                        </a>
                    </li>

                    <li>
                        <a href="statistics.html">
                            <i class="fa-solid fa-chart-line"></i>
                            Statistiques
                        </a>
                    </li>

                    <li>
                        <a href="profile.html">
                            <i class="fa-solid fa-user"></i>
                            Profil
                        </a>
                    </li>

                    <li>
                        <a href="index.html">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            Déconnexion
                        </a>
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- ================= CONTENU ================= -->

        <main class="content">

            <header class="header">

                <h1>Gestion des absences</h1>

            </header>

            <!-- Barre d'actions -->

            <section class="actions">

                <input type="text" id="searchAbsence" placeholder="Rechercher une absence...">

                <button id="btnSearchAbsence">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    Rechercher

                </button>

                <button id="btnAddAbsence">

                    <i class="fa-solid fa-plus"></i>

                    Ajouter

                </button>

            </section>

            <!-- Tableau -->

            <section class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Étudiant</th>

                            <th>Date</th>

                            <th>Statut</th>

                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="absencesTable">

                        <tr>

                            <td colspan="5">

                                Aucune absence trouvée

                            </td>

                        </tr>

                    </tbody>

                </table>

            </section>

        </main>

    </div>

    <!-- ================= MODAL ================= -->

    <div class="modal" id="absenceModal">

        <div class="modal-content">

            <h2>Nouvelle absence</h2>

            <form id="absenceForm">

                <label>ID Étudiant</label>

                <input type="number" id="student_id" required>

                <label>Date</label>

                <input type="date" id="date" required>

                <label>Statut</label>

                <select id="status">

                    <option value="1">Justifiée</option>

                    <option value="0">Non justifiée</option>

                </select>

                <div class="buttons">

                    <button type="submit">

                        Enregistrer

                    </button>

                    <button type="button" id="closeAbsenceModal">

                        Annuler

                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="js/absences.js"></script>

</body>

</html>
