<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matières | School Management</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/table.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-solid fa-graduation-cap"></i>
          <h2>School Management</h2>
        </div>
        <nav>
          <ul>
            <li>
              <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                Tableau de bord
              </a>
            </li>
            <li>
              <a href="users.html">
                <i class="fa-solid fa-users"></i>
                Utilisateurs
              </a>
            </li>
            <li>
              <a href="students.html">
                <i class="fa-solid fa-user-graduate"></i>
                Étudiants
              </a>
            </li>
            <li>
              <a href="teachers.html">
                <i class="fa-solid fa-chalkboard-user"></i>
                Enseignants
              </a>
            </li>

            <li class="active">
              <a href="subjects.html">
                <i class="fa-solid fa-book"></i>
                Matières
              </a>
            </li>
            <li>
              <a href="grades.html">
                <i class="fa-solid fa-square-poll-horizontal"></i>
                Notes
              </a>
            </li>
            <li>
              <a href="absences.html">
                <i class="fa-solid fa-calendar-xmark"></i>
                Absences
              </a>
            </li>
            <li>
              <a href="statistics.html">
                <i class="fa-solid fa-chart-line"></i>
                Statistiques
              </a>
            </li>
            <li>
              <a href="profile.html">
                <i class="fa-solid fa-user"></i>
                Profil
              </a>
            </li>
            <li>
              <a href="index.html">
                <i class="fa-solid fa-right-from-bracket"></i>
                Déconnexion
              </a>
            </li>
          </ul>
        </nav>
      </aside>
      <main class="content">
        <header class="header">
          <h1>Gestion des matières</h1>
        </header>
        <section class="actions">
          <input type="text" id="searchSubject"placeholder="Rechercher une matière..."/>
          <button id="btnSearchSubject">
            <i class="fa-solid fa-magnifying-glass"></i>
            Rechercher
          </button>
          <button id="btnAddSubject">
            <i class="fa-solid fa-plus"></i>
            Ajouter
          </button>
        </section>
        <section class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Professeur</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="subjectsTable">
              <tr>
                <td colspan="4">Aucune matière trouvée</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <div class="modal" id="subjectModal">
      <div class="modal-content">
        <h2>Nouvelle matière</h2>
        <form id="subjectForm">
          <label>Nom de la matière</label>
          <input type="text" id="nom" required />
          <label>ID du professeur</label>
          <input type="number" id="teacher_id" required />
          <div class="buttons">
            <button type="submit">Enregistrer</button>
            <button type="button" id="closeSubjectModal">Annuler</button>
          </div>
        </form>
      </div>
    </div>
    <script src="js/subjects.js"></script>
  </body>
</html>
