<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Étudiants | School Management</title>

    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/table.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-solid fa-graduation-cap"></i>
          <h2>School Management</h2>
        </div>
        <nav>
          <ul>
            <li>
              <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                Tableau de bord
              </a>
            </li>
            <li>
              <a href="users.html">
                <i class="fa-solid fa-users"></i>
                Utilisateurs
              </a>
            </li>
            <li class="active">
              <a href="students.html">
                <i class="fa-solid fa-user-graduate"></i>
                Étudiants
              </a>
            </li>
            <li>
              <a href="teachers.html">
                <i class="fa-solid fa-chalkboard-user"></i>
                Enseignants
              </a>
            </li>
            <li>
              <a href="subjects.html">
                <i class="fa-solid fa-book"></i>
                Matières
              </a>
            </li>
            <li>
              <a href="grades.html">
                <i class="fa-solid fa-square-poll-horizontal"></i>
                Notes
              </a>
            </li>
            <li>
              <a href="absences.html">
                <i class="fa-solid fa-calendar-xmark"></i>
                Absences
              </a>
            </li>
            <li>
              <a href="statistics.html">
                <i class="fa-solid fa-chart-line"></i>
                Statistiques
              </a>
            </li>
            <li>
              <a href="profile.html">
                <i class="fa-solid fa-user"></i>
                Profil
              </a>
            </li>
            <li>
              <a href="index.html">
                <i class="fa-solid fa-right-from-bracket"></i>
                Déconnexion
              </a>
            </li>
          </ul>
        </nav>
      </aside>
      <main class="content">
        <header class="header">
          <h1>Gestion des étudiants</h1>
        </header>
        <section class="actions">
          <input type="text" id="searchStudent" placeholder="Rechercher un étudiant..."/>
          <button id="btnSearchStudent">
            <i class="fa-solid fa-magnifying-glass"></i>
            Rechercher
          </button>
          <button id="btnAddStudent">
            <i class="fa-solid fa-plus"></i>
            Ajouter
          </button>
        </section>
        <section class="table-container">
          <table>
            <thead>
              <tr>
                <th>Matricule</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Âge</th>
                <th>Classe</th>
                <th>Utilisateur</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="studentsTable">
              <tr>
                <td colspan="7">Aucun étudiant trouvé</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <div class="modal" id="studentModal">
      <div class="modal-content">
        <h2>Étudiant</h2>
        <form id="studentForm">
          <label>Matricule</label>
          <input type="number" id="matricule" required />
          <label>Nom</label>
          <input type="text" id="nom" required />
          <label>Prénom</label>
          <input type="text" id="prenom" required />
          <label>Âge</label>
          <input type="number" id="age" required />
          <label>Classe</label>
          <input type="text" id="classe" required />
          <label>ID Utilisateur</label>
          <input type="number" id="users_id" required />
          <div class="buttons">
            <button type="submit">Enregistrer</button>
            <button type="button" id="closeStudentModal">Annuler</button>
          </div>
        </form>
      </div>
    </div>
    <script src="js/students.js"></script>
  </body>
</html>
